version = 1
SPDX-PackageName = "ghaf-fmo-laptop"
SPDX-PackageSupplier = "Technology Innovation Institute <https://tii.ae>"
SPDX-PackageDownloadLocation = "https://github.com/tiiuae/ghaf-fmo-laptop"

[[annotations]]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2022-2025 TII (SSRC) and the Ghaf contributors"
precedence = "closest"
path = [
  ".github/dependabot.yml",
  ".github/workflows/dependency-review.yml",
  ".github/workflows/scorecards.yml",
  "flake.lock",
  "README.md",
  "justfile"
]

[[annotations]]
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileCopyrightText = "2022-2025 TII (SSRC) and the Ghaf contributors"
precedence = "closest"
path = [
  # Claude Code skills and agents: the YAML frontmatter has to be the first thing in the
  # file for the loader to parse it, so these cannot carry an SPDX comment header.
  ".claude/skills/**/SKILL.md",
  ".claude/agents/*.md"
]
